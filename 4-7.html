<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 100px;
            height: 140px;
            background-image: url(/사과.jpg);
            background-size: 100px 140px;
        }

        div#img:hover {
            background-image: url(/멜론.jpg);
        }
    </style>
</head>

<body>
    <h3>:hover 활용</h3>
    <hr>
    <table>
        <tr>
            <td>마우스를 올리면 카드의 앞면이 보인다</td>
            <td>
                <div id="img"></div>
            </td>
        </tr>
    </table>
</body>

</html>
