<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>setInterval()/learInterval()</title>

    <script>
        var time = null;

        function onofftime() {
            if (time != null) {
                clearInterval(time);
                time = null;
                document.getElementById("clock").style.color = "gray";
            } else {
                time = setInterval("outtime(clock)", 100);
                document.getElementById("clock").style.color = "black";
            }
        }

        function showtime() {
            var clock = document.getElementById("clock");
            outtime(clock);
            time = setInterval("outtime(clock)", 100);
        }

        function stop_start_clock(e) {
            var date = new Date();
            e.innerHTML = date.toLocaleTimeString();
        }
    </script>

<body onload="startClock()">
    <h3>div 태그에 시계 만들기</h3>
    <p>시계를 클릭하면 시계가 멈추고 다시 클릭하면 가기 시작한다.</p>
    <hr />
    <div id="clock" onclick="stop_start_clock()"></div>
</body>

</html>
