<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h3>도형 서식 폼 만들기</h3>
    <hr>
    <fieldset>
        <legend>도형 서식 입력</legend>
        선종류<select name="선종류">
            <option value="1">선없음</option>
            <option value="2">실선</option>
            <option value="3">점섬</option>
        </select>
        <br>
        선두께 <input type="text"> 선색 <input type="color" name="" id="" value="#00BFFF">
        <br>
        투명도(0~100): <input type="range" min="1" max="100" list="clearness">
        <datalist id="clearness">
            <option value="1" label="Low"></option>
            <option value="50" label="Medium"></option>
            <option value="100" label="High"></option>
        </datalist>
    </fieldset>
</body>

</html>
