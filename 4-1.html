<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>태그 셀렉터 만들기</title>
    <style>
        body {
            background-color: antiquewhite;
        }

        h3 {
            color: darkblue;
            text-align: right;
        }

        hr,
        p {
            color: purple;
        }

        span {
            background-color: darkcyan;
        }
    </style>
</head>

<body>
    <h3>소연재</h3>
    <hr>
    <p>저는 체조 선수 소연재입니다. <span style="color: blue;">음 <br>
            악</span>을 들으면서 책 읽기를 좋아합 <br>
        니다. <span style="color: blue;">김치 찌개</span>와 <span style="color: blue;">막국수 </span>무척 <br>
        좋아합니다.
    </p>
</body>

</html>
